<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Catálogo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tema antes da primeira pintura, para não "piscar" claro no modo escuro (a regra completa está no TemaService). -->
    <script>
      try {
        var t = localStorage.getItem('catalogo.tema');
        if (t === 'escuro' || (t !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('catalogo-escuro');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
