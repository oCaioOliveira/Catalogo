<app-cabecalho-pagina
  [trilha]="[{ rotulo: contexto.nomeGrupo(), link: ['/', grupo()] }, { rotulo: 'Painel' }]"
  titulo="Painel gerencial"
  icone="pi-chart-bar"
  [subtitulo]="'Indicadores da área de gestão ' + contexto.nomeGrupo() + ', no período escolhido.'"
>
  <a
    acoes
    class="p-button p-button-outlined p-button-secondary link-acao"
    [routerLink]="['analise']"
    [queryParams]="parametrosPainel()"
    ><i class="pi pi-sliders-h" aria-hidden="true"></i> Montar análise personalizada</a
  >
</app-cabecalho-pagina>

<app-filtros-painel [estado]="estado()" [opcoesEquipe]="contexto.opcoesEquipe()" (mudou)="mudarFiltros($event)" />

@if (contexto.erro()) {
  <app-estado-erro mensagem="Não foi possível carregar o painel." (tentarDeNovo)="tentarDeNovo()" />
} @else {
  <app-visao-geral [grupo]="grupo()" [estadoPainel]="estado()" [principal]="principal()" />

  @if (configuracao(); as configuracao) {
    <section class="secao-painel" aria-labelledby="indicadores-titulo">
      <h2 id="indicadores-titulo">Indicadores</h2>
      @if (contexto.entidades(); as entidades) {
        <div class="grade-painel">
          @for (widget of kpis(); track widget.id) {
            <app-widget [grupo]="grupo()" [configuracao]="widget" [estadoPainel]="estado()" [entidades]="entidades" />
          }
          @for (widget of graficos(); track widget.id) {
            <app-widget [grupo]="grupo()" [configuracao]="widget" [estadoPainel]="estado()" [entidades]="entidades" />
          }
        </div>
      } @else {
        <p-skeleton height="12rem" />
      }
    </section>
  }
}
