<app-cabecalho-pagina
  [trilha]="[{ rotulo: 'Configurações' }, { rotulo: 'Equipes' }]"
  titulo="Equipes"
  icone="pi-users"
  subtitulo="Os itens por equipe pertencem a uma equipe; os membros dela os veem e alteram."
>
  <p-button acoes label="Nova equipe" icon="pi pi-plus" routerLink="novo" />
</app-cabecalho-pagina>

<form class="painel-filtros filtros-administracao" aria-label="Filtros de equipes" (ngSubmit)="pesquisar()">
  <div class="campo campo-busca">
    <label class="campo-rotulo" for="equipes-busca">Nome</label>
    <input
      pInputText
      id="equipes-busca"
      name="busca"
      type="search"
      placeholder="Digite e tecle Enter"
      [(ngModel)]="busca"
    />
  </div>
  <div class="campo">
    <label class="campo-rotulo" for="equipes-situacao" id="equipes-situacao-rotulo">Situação</label>
    <p-select
      inputId="equipes-situacao"
      ariaLabelledBy="equipes-situacao-rotulo"
      name="situacao"
      placeholder="Todas"
      optionLabel="rotulo"
      optionValue="valor"
      appendTo="body"
      [showClear]="true"
      [options]="opcoesSituacao"
      [ngModel]="filtros().ativa"
      (ngModelChange)="filtrarSituacao($event ?? null)"
    />
  </div>
  <div class="acoes-filtros">
    <p-button type="submit" label="Pesquisar" icon="pi pi-search" [outlined]="true" />
  </div>
</form>

<div class="barra-tabela">
  <div class="barra-tabela-inicio">
    @if (resultado(); as r) {
      <span class="total-tabela" aria-live="polite">{{ r.total === 1 ? '1 equipe' : r.total + ' equipes' }}</span>
    }
  </div>
  <div class="barra-tabela-fim">
    <app-alternar-densidade />
  </div>
</div>

@if (erro()) {
  <app-estado-erro mensagem="Não foi possível carregar as equipes." (tentarDeNovo)="tentarDeNovo()" />
} @else {
  <p-table
    appSombraRolagem
    dataKey="id"
    styleClass="tabela-larga"
    [scrollable]="true"
    [size]="densidade.tamanhoTabela()"
    [value]="resultado()?.itens ?? []"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="(resultado()?.total ?? 0) > 0"
    [rows]="filtros().tamanho"
    [first]="(filtros().pagina - 1) * filtros().tamanho"
    [totalRecords]="resultado()?.total ?? 0"
    [rowsPerPageOptions]="opcoesTamanho"
    (onLazyLoad)="aoMudarTabela($event)"
  >
    <ng-template #header>
      <tr>
        <th pFrozenColumn>Nome</th>
        <th>Situação</th>
        <th class="coluna-numero">Membros ativos</th>
        <th class="coluna-acoes" pFrozenColumn alignFrozen="right"><span class="sr-only">Ações</span></th>
      </tr>
    </ng-template>
    <ng-template #body let-equipe>
      <tr class="linha-clicavel" (click)="abrir(equipe, $event)">
        <td pFrozenColumn class="coluna-principal">
          <a class="link-linha" [routerLink]="[equipe.id]">{{ equipe.nome }}</a>
        </td>
        <td>
          <p-tag [value]="equipe.ativa ? 'Ativa' : 'Inativa'" [severity]="equipe.ativa ? 'success' : 'secondary'" />
        </td>
        <td class="coluna-numero">{{ equipe.membrosAtivos }}</td>
        <td class="coluna-acoes" pFrozenColumn alignFrozen="right">
          <app-menu-acoes-linha [acoes]="acoesPorLinha().get(equipe.id) ?? []" [rotulo]="equipe.nome" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      @if (carregando()) {
        @for (linha of linhasEsqueleto; track linha) {
          <tr>
            <td colspan="4"><p-skeleton height="1.5rem" /></td>
          </tr>
        }
      } @else {
        <tr>
          <td colspan="4" class="celula-vazia">
            <app-estado-vazio icone="pi-users" titulo="Nenhuma equipe encontrada" [compacto]="true" />
          </td>
        </tr>
      }
    </ng-template>
  </p-table>
}
