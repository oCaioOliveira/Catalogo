<form class="painel-filtros" [formGroup]="formulario" (ngSubmit)="filtrar()" aria-label="Filtros">
  <div class="grade-filtros">
    @for (filtro of filtros(); track filtro.parametro) {
      <div class="campo">
        <label class="campo-rotulo" [for]="idDo(filtro)" [id]="idDo(filtro) + '-rotulo'">{{ filtro.rotulo }}</label>
        @switch (filtro.campo.tipo) {
          @case ('INTEIRO') {
            <p-inputnumber
              mode="decimal"
              locale="pt-BR"
              [maxFractionDigits]="0"
              [fluid]="true"
              [inputId]="idDo(filtro)"
              [formControl]="controle(filtro)"
            />
          }
          @case ('DECIMAL') {
            <p-inputnumber
              mode="decimal"
              locale="pt-BR"
              [maxFractionDigits]="filtro.campo.escala ?? 2"
              [fluid]="true"
              [inputId]="idDo(filtro)"
              [formControl]="controle(filtro)"
            />
          }
          @case ('DATA') {
            <p-datepicker
              dateFormat="dd/mm/yy"
              appendTo="body"
              placeholder="dd/mm/aaaa"
              [showIcon]="true"
              [showButtonBar]="true"
              [fluid]="true"
              [inputId]="idDo(filtro)"
              [formControl]="controle(filtro)"
            />
          }
          @case ('DATA_HORA') {
            <p-datepicker
              dateFormat="dd/mm/yy"
              appendTo="body"
              placeholder="dd/mm/aaaa"
              [showIcon]="true"
              [showButtonBar]="true"
              [fluid]="true"
              [inputId]="idDo(filtro)"
              [formControl]="controle(filtro)"
            />
          }
          @case ('LISTA') {
            <p-select
              appendTo="body"
              placeholder="Todos"
              [showClear]="true"
              [fluid]="true"
              optionLabel="rotulo"
              optionValue="valor"
              [options]="opcoesDe(filtro)"
              [inputId]="idDo(filtro)"
              [ariaLabelledBy]="idDo(filtro) + '-rotulo'"
              [formControl]="controle(filtro)"
            />
          }
          @case ('BOOLEANO') {
            <p-select
              appendTo="body"
              placeholder="Todos"
              optionLabel="rotulo"
              optionValue="valor"
              [showClear]="true"
              [fluid]="true"
              [options]="opcoesBooleano"
              [inputId]="idDo(filtro)"
              [ariaLabelledBy]="idDo(filtro) + '-rotulo'"
              [formControl]="controle(filtro)"
            />
          }
          @case ('REFERENCIA') {
            <app-campo-referencia
              placeholder="Todos"
              [inputId]="idDo(filtro)"
              [controle]="controle(filtro)"
              [buscar]="buscaDe(filtro)"
            />
          }
          @default {
            <input pInputText type="search" class="w-full" [id]="idDo(filtro)" [formControl]="controle(filtro)" />
          }
        }
      </div>
    }
  </div>
  <div class="acoes-filtros">
    <p-button
      type="button"
      label="Limpar filtros"
      icon="pi pi-filter-slash"
      severity="secondary"
      [text]="true"
      (onClick)="limpar()"
    />
    <p-button type="submit" label="Filtrar" icon="pi pi-filter" [outlined]="true" />
  </div>
</form>
