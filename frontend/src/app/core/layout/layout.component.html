<a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
<header class="cabecalho-app">
  <div class="cabecalho-esquerda">
    <p-button
      icon="pi pi-bars"
      severity="secondary"
      [text]="true"
      [ariaLabel]="rotuloBotaoMenu()"
      [pTooltip]="rotuloBotaoMenu()"
      tooltipPosition="bottom"
      [attr.aria-expanded]="telaEstreita() ? gavetaAberta() : !recolhido()"
      ariaControls="menu-lateral"
      (onClick)="alternarMenu()"
    />
    <!-- Logo | nome | seletor: um contêiner flex com um gap só e as barrinhas como elementos próprios (espaços iguais dos dois lados). -->
    <div class="identidade-cabecalho">
      <a class="marca" [routerLink]="inicio()" aria-label="Início — Catálogo">
        <app-logo-marca [altura]="24" />
      </a>
      <span class="separador-cabecalho" aria-hidden="true"></span>
      <span class="marca-nome">Catálogo</span>
      <span class="separador-cabecalho separador-apos-nome" aria-hidden="true"></span>
      <app-seletor-area />
    </div>
  </div>
  <div class="cabecalho-direita">
    @if (mostrarAprovacoes()) {
      <a
        class="botao-cabecalho"
        routerLink="/aprovacoes"
        [attr.aria-label]="
          pendentes.quantidade()
            ? 'Aprovações (' +
              (pendentes.quantidade() === 1 ? '1 pendente' : pendentes.quantidade() + ' pendentes') +
              ')'
            : 'Aprovações'
        "
        pTooltip="Aprovações"
        tooltipPosition="bottom"
      >
        <i class="pi pi-inbox" aria-hidden="true"></i>
        @if (pendentes.quantidade(); as n) {
          <p-badge [value]="n" styleClass="contador-cabecalho" aria-hidden="true" />
        }
      </a>
    }
    @if (permissoes.podeConfigurarEquipe()) {
      <a
        class="botao-cabecalho"
        routerLink="/configuracoes"
        [class.ativo]="emConfiguracoes()"
        [attr.aria-current]="emConfiguracoes() ? 'page' : null"
        aria-label="Configurações"
        pTooltip="Configurações"
        tooltipPosition="bottom"
      >
        <i class="pi pi-cog" aria-hidden="true"></i>
      </a>
    }
    <app-botao-tema />
    <app-menu-usuario />
  </div>
</header>

<div class="corpo-app" [class.so-icones]="soIcones()" [class.com-gaveta]="telaEstreita()">
  <nav
    id="menu-lateral"
    class="menu-lateral"
    [class.aberto]="menuVisivel()"
    [attr.aria-label]="emConfiguracoes() ? 'Menu de configurações' : 'Menu da área de gestão'"
    [attr.hidden]="menuVisivel() ? null : ''"
  >
    @if (emConfiguracoes()) {
      <app-menu-configuracoes [recolhido]="soIcones()" (navegou)="aoNavegar()" />
    } @else {
      <app-menu-area
        [grupo]="areaAtual.grupo()"
        [entidades]="entidades()"
        [erro]="erroMenu()"
        [recolhido]="soIcones()"
        (navegou)="aoNavegar()"
        (tentarDeNovo)="carregarMenu()"
      />
    }
  </nav>
  @if (telaEstreita() && gavetaAberta()) {
    <div class="fundo-gaveta" aria-hidden="true" (click)="gavetaAberta.set(false)"></div>
  }

  <main id="conteudo" class="conteudo" tabindex="-1">
    <router-outlet />
  </main>
</div>

<p-confirmdialog />
<p-confirmdialog key="bloqueio" styleClass="dialogo-bloqueio" />
