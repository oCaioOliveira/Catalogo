# SQL Server local para DESENVOLVIMENTO do projeto Listagem Genérica.
# Em produção não há Docker: os scripts de database/scripts/ são aplicados manualmente.
#
# Rode sempre a partir de database/docker, apontando para o .env:
#   docker compose --env-file ../.env up -d

name: listagem-generica

x-mssql-image: &mssql-image mcr.microsoft.com/mssql/server:2022-latest

services:
  db:
    image: *mssql-image
    container_name: listagem-generica-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no database/.env e use --env-file ../.env}
      # A collation do servidor só é aplicada na criação do volume. Para trocar, faça o reset (ver README).
      MSSQL_COLLATION: ${MSSQL_COLLATION:-Latin1_General_CI_AI}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    # Além do SELECT 1, só fica saudável quando todos os bancos terminaram o recovery (ONLINE).
    # Sem isso, depois de um restart o db-init pode tentar usar o banco ainda em recuperação.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -o /dev/null -Q \"SELECT 1; IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') RAISERROR('bancos em recovery', 16, 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Roda uma vez e encerra: cria banco/login (init/) e aplica database/scripts/ pendentes (estrutura no schema cat, V014;
  # as tabelas antigas do schema catalogo não são alteradas).
  db-init:
    image: *mssql-image
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      # Bancos preparados, separados por espaço: o de desenvolvimento e o dos testes de
      # integração (que é limpo a cada teste). Os dois recebem os mesmos scripts.
      DB_NAMES: ListagemGenerica ListagemGenerica_Testes
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no database/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no database/.env}
      SCRIPTS_DIR: /scripts
    volumes:
      - ./init:/init:ro
      - ../scripts:/scripts:ro
      - ./aplicar_scripts.sh:/aplicar_scripts.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for DB_NAME in $$DB_NAMES; do
          echo "########## Banco $$DB_NAME"
          for f in /init/*.sql; do
            echo "==> init: $$(basename "$$f")"
            /opt/mssql-tools18/bin/sqlcmd -C -b -S "$$DB_HOST" -U sa -P "$$MSSQL_SA_PASSWORD" \
              -v DB_NAME="$$DB_NAME" APP_DB_PASSWORD="$$APP_DB_PASSWORD" -i "$$f"
          done
          DB_NAME="$$DB_NAME" bash /aplicar_scripts.sh
          # O papel catalogo_aplicacao nasce no V014: num banco novo, o vínculo do listagem_app só existe depois dele.
          /opt/mssql-tools18/bin/sqlcmd -C -b -S "$$DB_HOST" -U sa -P "$$MSSQL_SA_PASSWORD" \
            -v DB_NAME="$$DB_NAME" APP_DB_PASSWORD="$$APP_DB_PASSWORD" -i /init/01_criar_login_app.sql
        done
    restart: "no"

volumes:
  mssql-data:
